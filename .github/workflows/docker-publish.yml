name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 格式的 tag 时触发，例如 v3.1.2

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📝 Extract version from tag
        id: meta
        run: |
          # 从 tag 中提取版本号，例如 v3.1.2 -> 3.1.2
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            liangdiandian/ech0:${{ steps.meta.outputs.version }}
            liangdiandian/ech0:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Image pushed successfully
        run: |
          echo "🎉 Docker images pushed successfully!"
          echo "📦 liangdiandian/ech0:${{ steps.meta.outputs.version }}"
          echo "📦 liangdiandian/ech0:latest"
